<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen — مساعدك الذكي</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{--bg:#0e1013;--panel:#17181c;--panel2:#1b1c21;--border:#2a2b31;--txt:#ececf1;--mut:#9a9ba3;--acc1:#6e5ffb;--acc2:#3fa9f5;--grad:linear-gradient(135deg,var(--acc1),var(--acc2))}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Inter,sans-serif}
body{background:var(--bg);color:var(--txt);height:100vh;display:flex;overflow:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#33343a;border-radius:3px}
/* ── السايدبار ── */
#side{width:270px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;padding:14px;gap:10px}
.logo{display:flex;align-items:center;gap:10px;padding:6px 4px}
.logo b{font-size:19px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{background:var(--panel2);border:1px solid var(--border);color:var(--txt);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:14px;transition:.2s}
.btn:hover{border-color:var(--acc1)}
.btn.primary{background:var(--grad);border:none;font-weight:600}
#modelsList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.mgroup{color:var(--mut);font-size:11px;margin:10px 4px 4px}
.mitem{display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px;cursor:pointer;font-size:13px}
.mitem:hover{background:var(--panel2)}
.mitem.on{background:var(--panel2);border:1px solid var(--acc1)}
.mlogo{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
/* ── الرئيسي ── */
#main{flex:1;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border)}
#curModel{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;padding:6px 12px;border-radius:10px}
#curModel:hover{background:var(--panel2)}
.sw{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);cursor:pointer;user-select:none}
.sw i{width:34px;height:19px;background:#33343a;border-radius:20px;position:relative;transition:.2s}
.sw i::after{content:'';position:absolute;width:15px;height:15px;background:#fff;border-radius:50%;top:2px;right:2px;transition:.2s}
.sw.on i{background:var(--acc1)} .sw.on i::after{right:17px}
#stopBtn{display:none;background:#e5484d;border:none;color:#fff;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:600}
#chat{flex:1;overflow-y:auto;padding:24px 12px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
/* الترحيب */
#welcome{text-align:center;padding-top:9vh}
#welcome .big{width:74px;height:74px;margin:0 auto 18px;border-radius:20px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;box-shadow:0 0 60px #6e5ffb55}
#welcome h1{font-size:27px;margin-bottom:8px}
#welcome p{color:var(--mut);margin-bottom:26px}
#sugg{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:640px;margin:0 auto}
#sugg div{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:13px;font-size:13px;cursor:pointer;text-align:right;transition:.2s}
#sugg div:hover{border-color:var(--acc1);transform:translateY(-2px)}
/* الرسائل */
.msg{display:flex;gap:12px}
.msg .av{width:32px;height:32px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0}
.msg.user{justify-content:flex-end}
.msg.user .bub{background:#26282e;border-radius:18px 18px 4px 18px;padding:11px 16px;max-width:75%;white-space:pre-wrap}
.msg.ai .body{max-width:92%;line-height:1.8;font-size:15px;min-width:0}
.msg.ai .body img{max-width:100%;border-radius:12px;margin:6px 0}
.msg.ai .body pre{direction:ltr;text-align:left;border-radius:12px;margin:10px 0;position:relative}
.msg.ai .body table{border-collapse:collapse;margin:10px 0;width:100%}
.msg.ai .body th,.msg.ai .body td{border:1px solid var(--border);padding:7px 10px;font-size:13px}
.msg.ai .body th{background:var(--panel2)}
.msg.ai .body h1,.msg.ai .body h2,.msg.ai .body h3{margin:12px 0 6px}
.msg.ai .body ul,.msg.ai .body ol{padding-right:20px;margin:6px 0}
.copybtn{position:absolute;top:6px;right:6px;background:#33343a;border:none;color:#bbb;border-radius:6px;padding:3px 9px;cursor:pointer;font-size:11px}
.cursor::after{content:'▌';animation:bl 1s infinite}
@keyframes bl{50%{opacity:0}}
.att img{max-height:120px;border-radius:10px;margin-top:6px}
/* الإدخال */
#inZone{padding:14px 20px 20px}
#inBox{max-width:820px;margin:0 auto;background:var(--panel2);border:1px solid var(--border);border-radius:22px;padding:10px;transition:.2s}
#inBox:focus-within{border-color:var(--acc1);box-shadow:0 0 0 3px #6e5ffb22}
#inText{width:100%;background:none;border:none;outline:none;color:var(--txt);resize:none;font-size:15px;max-height:180px;padding:8px 10px;line-height:1.6}
#inBar{display:flex;align-items:center;gap:8px;padding:2px 6px}
#attPrev{display:flex;gap:6px;padding:0 10px}
#attPrev img{height:44px;border-radius:8px}
#sendBtn{margin-right:auto;background:var(--grad);border:none;width:38px;height:38px;border-radius:12px;color:#fff;font-size:17px;cursor:pointer}
#hint{max-width:820px;margin:8px auto 0;text-align:center;color:var(--mut);font-size:11px}
.iconbtn{background:none;border:1px solid var(--border);color:var(--mut);width:36px;height:36px;border-radius:11px;cursor:pointer;font-size:16px}
.iconbtn:hover{color:var(--txt);border-color:var(--acc1)}
/* الكتالوج */
#catalog{position:fixed;inset:0;background:#0e1013f2;backdrop-filter:blur(6px);z-index:50;overflow-y:auto;padding:40px 20px;display:none}
#catalog.show{display:block}
#catalog .in{max-width:1000px;margin:0 auto}
#catalog h1{font-size:26px;text-align:center;margin-bottom:6px}
#catalog p{text-align:center;color:var(--mut);margin-bottom:28px}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;transition:.2s}
.card:hover{border-color:var(--acc1);transform:translateY(-3px)}
.card h3{font-size:15px;margin:10px 0 8px;display:flex;align-items:center;gap:8px}
.card .tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.tag{background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:2px 9px;font-size:10.5px;color:var(--mut)}
.card .ctx{color:var(--mut);font-size:11px;margin-bottom:10px}
.card .desc{font-size:12px;color:var(--mut);margin-bottom:12px;min-height:32px}
.card button{width:100%}
.crown{background:var(--grad);color:#fff;border-radius:20px;padding:2px 9px;font-size:10px}
#closeCat{position:fixed;top:18px;left:18px;z-index:60}
audio{width:100%;margin:8px 0}
</style>
</head>
<body>

<aside id="side">
  <div class="logo"><div class="mlogo" style="background:var(--grad);width:32px;height:32px;font-size:16px">Q</div><b>Qwen</b></div>
  <button class="btn primary" onclick="newChat()">＋ محادثة جديدة</button>
  <button class="btn" onclick="toggleCatalog(true)">🗂 كل النماذج</button>
  <div id="modelsList"></div>
  <button class="btn" onclick="newChat()">🗑 مسح المحادثة</button>
</aside>

<main id="main">
  <div id="top">
    <div id="curModel" onclick="toggleCatalog(true)"></div>
    <div class="sw" id="searchSw" onclick="this.classList.toggle('on')"><i></i> بحث في الويب</div>
    <button id="stopBtn" onclick="stopGen()">⏹ إيقاف</button>
  </div>
  <div id="chat"><div class="wrap" id="wrap"></div></div>
  <div id="inZone">
    <div id="attPrev"></div>
    <div id="inBox">
      <textarea id="inText" rows="1" placeholder="ابعت رسالة لـ Qwen..."></textarea>
      <div id="inBar">
        <button class="iconbtn" id="attBtn" title="إرفاق" onclick="attClick()">📎</button>
        <input type="file" id="attFile" hidden multiple>
        <button id="sendBtn" onclick="send()">➤</button>
      </div>
    </div>
    <div id="hint">Qwen ممكن يغلط أحياناً — تحقق من المعلومات المهمة · مدعوم بـ DashScope</div>
  </div>
</main>

<div id="catalog">
  <button class="btn" id="closeCat" onclick="toggleCatalog(false)">✕ إغلاق</button>
  <div class="in">
    <h1>Building AI Products with <span style="background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Qwen</span></h1>
    <p>نماذجنا الرائدة — اختار النموذج وابدأ فوراً</p>
    <div id="cards"></div>
  </div>
</div>

<script>
/* ═══════════ 🔑 الإعدادات ═══════════ */
const API_KEY = "sk-ws-H.DMMHEPL.KSs1.MEYCIQD3ZfmiHvI-deFM8Qx4YL5gRUnvGxAAcqHCixO5REX2HwIhAJOlQ71eg0tXPf5C7ViKTerYT5zoFoGxrerfciPSAkfh";
const BASE = "https://dashscope-intl.aliyuncs.com";
const SYS = "أنت Qwen، مساعد ذكي ودود ومحترف. طابق لغة المستخدم (مصري/فصحى)، كن مباشراً بدون حشو، نسّق بـ Markdown (عناوين، قوائم، جداول، أكواد)، اعترف لو مش متأكد.";

/* ═══════════ 🧠 النماذج كلها ═══════════ */
const G = {flag:['#6e5ffb','#3fa9f5'],chat:['#4f46e5','#7c3aed'],vision:['#0ea5e9','#22d3ee'],omni:['#f59e0b','#ef4444'],asr:['#10b981','#14b8a6'],tts:['#ec4899','#f43f5e'],image:['#8b5cf6','#d946ef'],imageedit:['#a855f7','#6366f1']};
const GL = {flag:'✦',chat:'Q',vision:'V',omni:'O',asr:'A',tts:'T',image:'I',imageedit:'E'};
const M = (id,cat,inp,out,ctx,desc,flag)=>({id,cat,inp,out,ctx,desc,flag});
const MODELS = [
 M('qwen3.8-max','flag',['نص','صورة','فيديو'],['نص'],'1,000,000','الجيل الأحدث والأقوى — نفس عقل الشات الحالي',1),
 M('qwen3.7-max','chat',['نص'],['نص'],'1,000,000','النموذج القيادي للمهام المعقدة'),
 M('qwen3.7-plus','vision',['نص','صورة','فيديو'],['نص'],'1,000,000','متعدد الوسائط متوازن وسريع'),
 M('qwen3.6-max-preview','chat',['نص'],['نص'],'262,144','معاينة الجيل الجديد'),
 M('qwen3.6-plus','vision',['نص','صورة','فيديو'],['نص'],'1,000,000','ذكاء عالي بتكلفة أقل'),
 M('qwen3.5-plus','vision',['نص','صورة','فيديو'],['نص'],'1,000,000','سريع وذكي للاستخدام اليومي'),
 M('qwen3.5-flash','vision',['نص','صورة','فيديو'],['نص'],'1,000,000','الأخف والأسرع'),
 M('qwen3-max','chat',['نص'],['نص'],'262,144','الجيل الثالث الرائد'),
 M('qwen3-vl-plus','vision',['نص','صورة','فيديو'],['نص'],'131,027','فهم صور وفيديو بدقة عالية'),
 M('qwen3-vl-flash','vision',['نص','صورة','فيديو'],['نص'],'131,027','رؤية سريعة وخفيفة'),
 M('qwen3-omni-flash','omni',['نص','صورة','صوت','فيديو'],['نص','صوت'],'65,536','يفهم كل شيء ويرد صوتاً'),
 M('qwen3-asr-flash','asr',['صوت'],['نص'],'—','تحويل الكلام إلى نص بدقة'),
 M('qwen3-tts-flash','tts',['نص'],['صوت'],'—','تحويل النص إلى كلام طبيعي'),
 M('qwen-image-2.0-pro','image',['نص','صورة'],['صورة'],'—','رسم احترافي بدقة 2K'),
 M('qwen-image-2.0','image',['نص','صورة'],['صورة'],'—','رسم وتفصيلات واقعية'),
 M('qwen-image-plus','image',['نص'],['صورة'],'—','توليد صور من النص'),
 M('qwen-image-edit','imageedit',['نص','صورة'],['صورة'],'—','تعديل الصور بالأوامر'),
];
let cur = MODELS[0], history = [], atts = [], aborter = null, busy = false;

const logo = (m,s=26)=>`<div class="mlogo" style="width:${s}px;height:${s}px;background:linear-gradient(135deg,${G[m.cat][0]},${G[m.cat][1]})">${GL[m.cat]}</div>`;
const $ = id=>document.getElementById(id);
const isChat = m=>['flag','chat','vision','omni'].includes(m.cat);

/* ═══════════ 🖥 الواجهة ═══════════ */
function renderSide(){
  const groups = {'⭐ الرائد':'flag','💬 نصوص':'chat','🖼 رؤية':'vision','🎙 Omni':'omni','🔊 صوت':'asr,tts','🎨 صور':'image,imageedit'};
  let h='';
  for(const [g,cats] of Object.entries(groups)){
    h += `<div class="mgroup">${g}</div>`;
    MODELS.filter(m=>cats.includes(m.cat)).forEach(m=>{
      h += `<div class="mitem ${m.id===cur.id?'on':''}" onclick="pick('${m.id}')">${logo(m)}<span>${m.id}${m.flag?' 👑':''}</span></div>`;
    });
  }
  $('modelsList').innerHTML = h;
  $('curModel').innerHTML = logo(cur,22)+`<span>${cur.id}</span> <span style="color:var(--mut)">▾</span>`;
}
function renderCards(){
  $('cards').innerHTML = MODELS.map(m=>`
   <div class="card">${logo(m,38)}
     <h3>${m.id} ${m.flag?'<span class="crown">FLAGSHIP</span>':''}</h3>
     <div class="tags">${m.inp.map(i=>`<span class="tag">⬅ ${i}</span>`).join('')}${m.out.map(o=>`<span class="tag">➡ ${o}</span>`).join('')}</div>
     <div class="ctx">📏 سياق: ${m.ctx}</div>
     <div class="desc">${m.desc}</div>
     <button class="btn primary" onclick="pick('${m.id}');toggleCatalog(false)">استخدام النموذج</button>
   </div>`).join('');
}
function toggleCatalog(v){ $('catalog').classList.toggle('show',v); }
function pick(id){ cur = MODELS.find(m=>m.id===id); atts=[]; renderAtt(); renderSide(); adaptInput(); }
function adaptInput(){
  const ph = {chat:'ابعت رسالة لـ Qwen...',flag:'اسألني أي حاجة — أنا Qwen 3.8 Max 👑',vision:'اسأل أو أرفق صورة للتحليل...',omni:'نص أو صورة أو صوت...',image:'صف الصورة اللي عايز ترسمها...',imageedit:'اكتب التعديل وارفق الصورة...',tts:'اكتب النص اللي عايز تسمعه...',asr:'اضغط 📎 وارفق ملف صوتي للتفريغ...'};
  $('inText').placeholder = ph[cur.cat]||'...';
  $('attBtn').style.display = ['chat'].includes(cur.cat)?'none':'inline-block';
}
function newChat(){ history=[]; atts=[]; renderAtt(); $('wrap').innerHTML=''; welcome(); }

function welcome(){
  $('wrap').innerHTML = `<div id="welcome"><div class="big">✦</div>
   <h1>أهلاً بيك، أنا <span style="background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Qwen</span></h1>
   <p>اسأل، حلّل صور، ارسم، حوّل صوت — كل النماذج تحت أمرك</p>
   <div id="sugg">
     <div onclick="useS(this)">اشرحلي الحوسبة الكمومية ببساطة مع مثال</div>
     <div onclick="useS(this)">اكتبلي سكربت بايثون ينظم ملفاتي</div>
     <div onclick="useS(this)">قارنلي بين بايثون و جافاسكريبت في جدول</div>
     <div onclick="useS(this)">ارسم مدينة عربية قديمة وقت الغروب</div>
   </div></div>`;
}
function useS(el){ $('inText').value = el.textContent; send(); }

/* ═══════════ 📎 المرفقات ═══════════ */
function attClick(){ $('attFile').accept = cur.cat==='asr'?'audio/*':(cur.cat==='tts'?'':'image/*,audio/*'); $('attFile').click(); }
$('attFile').onchange = async e=>{
  for(const f of e.target.files){
    const b64 = await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f);});
    atts.push({type:f.type.startsWith('audio')?'audio':'image', data:b64});
  }
  renderAtt(); e.target.value='';
};
function renderAtt(){ $('attPrev').innerHTML = atts.map((a,i)=>a.type==='image'?`<img src="${a.data}">`:`<span class="tag">🎙 صوت ${i+1}</span>`).join(''); }

/* ═══════════ 🚀 الإرسال ═══════════ */
async function send(){
  if(busy) return;
  const txt = $('inText').value.trim();
  if(!txt && !atts.length) return;
  $('inText').value=''; $('inText').style.height='auto';
  const w = $('welcome'); if(w) w.remove();
  if(cur.cat==='image'||cur.cat==='imageedit') return genImage(txt);
  if(cur.cat==='tts') return tts(txt);
  if(cur.cat==='asr') return asr();
  return chat(txt);
}
function stopGen(){ if(aborter) aborter.abort(); }

/* ── شات ستريمينج ── */
async function chat(txt){
  busy=true; $('stopBtn').style.display='inline-block';
  addUser(txt);
  const content=[];
  atts.forEach(a=>{ a.type==='image'?content.push({type:'image_url',image_url:{url:a.data}}):content.push({type:'input_audio',input_audio:{data:a.data.split(',')[1],format:'wav'}}); });
  if(txt) content.push({type:'text',text:txt});
  history.push({role:'user',content});
  atts=[]; renderAtt();
  const aiEl = addAI();
  aborter = new AbortController();
  let full='';
  try{
    const resp = await fetch(BASE+'/compatible-mode/v1/chat/completions',{method:'POST',signal:aborter.signal,
      headers:{'Authorization':'Bearer '+API_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({model:cur.id,messages:[{role:'system',content:SYS},...history],stream:true,temperature:0.7,enable_search:$('searchSw').classList.contains('on')})});
    const rd = resp.body.getReader(), dc = new TextDecoder(); let buf='';
    while(true){
      const {done,value} = await rd.read(); if(done) break;
      buf += dc.decode(value,{stream:true});
      const lines = buf.split('\n'); buf = lines.pop();
      for(const ln of lines){
        if(!ln.startsWith('data:')) continue;
        const d = ln.slice(5).trim(); if(d==='[DONE]') continue;
        try{ full += JSON.parse(d).choices?.[0]?.delta?.content||''; }catch(e){}
      }
      paint(aiEl, full, true);
    }
  }catch(e){ if(e.name!=='AbortError') full += `\n\n⚠️ خطأ: ${e.message}`; }
  paint(aiEl, full, false);
  history.push({role:'assistant',content:[{type:'text',text:full}]});
  busy=false; $('stopBtn').style.display='none'; aborter=null;
}
function paint(el, txt, live){
  el.querySelector('.body').innerHTML = marked.parse(txt)+(live?'<span class="cursor"></span>':'');
  el.querySelectorAll('pre code').forEach(c=>hljs.highlightElement(c));
  $('chat').scrollTop = 1e9;
}
function addUser(txt){
  const d=document.createElement('div'); d.className='msg user';
  d.innerHTML=`<div class="bub">${esc(txt)}${atts.length?'<div class="att">'+atts.map(a=>a.type==='image'?`<img src="${a.data}">`:'🎙').join('')+'</div>':''}</div>`;
  $('wrap').appendChild(d); $('chat').scrollTop=1e9;
}
function addAI(){
  const d=document.createElement('div'); d.className='msg ai';
  d.innerHTML=`${logo(cur,32)}<div class="body"></div>`;
  $('wrap').appendChild(d); return d;
}
const esc = s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ── رسم الصور (Async Task) ── */
async function genImage(txt){
  busy=true; addUser(txt); const aiEl=addAI();
  aiEl.querySelector('.body').innerHTML='🎨 جاري الرسم... <span class="cursor"></span>';
  try{
    const isEdit = cur.cat==='imageedit';
    const url = isEdit? BASE+'/api/v1/services/aigc/multimodal-generation/generation' : BASE+'/api/v1/services/aigc/text2image/image-synthesis';
    const body = isEdit? {model:cur.id,input:{messages:[{role:'user',content:[...(atts.filter(a=>a.type==='image').map(a=>({image:a.data}))),{text:txt}]}]}}
                       : {model:cur.id,input:{prompt:txt},parameters:{size:'1024*1024'}};
    const r = await fetch(url,{method:'POST',headers:{'Authorization':'Bearer '+API_KEY,'Content-Type':'application/json','X-DashScope-Async':'enable'},body:JSON.stringify(body)});
    const j = await r.json();
    if(!j.output?.task_id) throw new Error(j.message||JSON.stringify(j));
    let out=null;
    while(true){
      await new Promise(r2=>setTimeout(r2,2500));
      const t = await (await fetch(BASE+'/api/v1/tasks/'+j.output.task_id,{headers:{'Authorization':'Bearer '+API_KEY}})).json();
      if(t.output.task_status==='SUCCEEDED'){ out=t.output; break; }
      if(t.output.task_status==='FAILED') throw new Error(t.output.message||'فشل التوليد');
    }
    const urls = out.results?.map(x=>x.url) || out.choices?.flatMap(c=>c.message.content).filter(x=>x.image).map(x=>x.image) || [];
    aiEl.querySelector('.body').innerHTML = urls.map(u=>`<img src="${u}"><br><a href="${u}" target="_blank" class="tag">⬇ تحميل</a>`).join('') || '⚠️ مفيش نتيجة';
  }catch(e){ aiEl.querySelector('.body').innerHTML='⚠️ '+e.message; }
  busy=false; atts=[]; renderAtt(); $('chat').scrollTop=1e9;
}

/* ── نص → صوت ── */
async function tts(txt){
  busy=true; addUser(txt); const aiEl=addAI();
  aiEl.querySelector('.body').innerHTML='🔊 جاري التوليد...';
  try{
    const r = await fetch(BASE+'/compatible-mode/v1/audio/speech',{method:'POST',headers:{'Authorization':'Bearer '+API_KEY,'Content-Type':'application/json'},body:JSON.stringify({model:cur.id,input:txt,voice:'Cherry'})});
    if(!r.ok) throw new Error((await r.json()).message||'خطأ');
    const b = await r.blob(), u = URL.createObjectURL(b);
    aiEl.querySelector('.body').innerHTML=`<audio controls src="${u}"></audio><a href="${u}" download="qwen.mp3" class="tag">⬇ تحميل</a>`;
  }catch(e){ aiEl.querySelector('.body').innerHTML='⚠️ '+e.message; }
  busy=false; $('chat').scrollTop=1e9;
}

/* ── صوت → نص ── */
async function asr(){
  busy=true; addUser('🎙 [ملف صوتي]'); const aiEl=addAI();
  aiEl.querySelector('.body').innerHTML=' جاري التفريغ...';
  try{
    if(!atts.length) throw new Error('ارفق ملف صوتي الأول بالزر 📎');
    const fd = new FormData();
    const blob = await (await fetch(atts[0].data)).blob();
    fd.append('file', blob, 'audio.ogg'); fd.append('model', cur.id);
    const r = await fetch(BASE+'/compatible-mode/v1/audio/transcriptions',{method:'POST',headers:{'Authorization':'Bearer '+API_KEY},body:fd});
    const j = await r.json(); if(!j.text) throw new Error(j.message||'خطأ');
    aiEl.querySelector('.body').innerHTML = esc(j.text);
    atts=[]; renderAtt();
  }catch(e){ aiEl.querySelector('.body').innerHTML='⚠️ '+e.message; }
  busy=false; $('chat').scrollTop=1e9;
}
